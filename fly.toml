app = "teablog"
primary_region = "sjc"

kill_signal = "SIGTERM"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "/app/bin/migrate_and_seed"

[env]
  PHX_HOST = "teablog.fly.dev"
  PORT = "4000"
  POOL_SIZE = "5"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/"
    protocol = "http"
    timeout = "5s"

    [http_service.checks.headers]
      X-Forwarded-Proto = "https"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
